name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build & test trilha-log
        run: mvn --batch-mode --no-transfer-progress install

      - name: Compile sample-app (consome trilha-log do repositório Maven local)
        run: mvn --batch-mode --no-transfer-progress -f sample-app/pom.xml compile
